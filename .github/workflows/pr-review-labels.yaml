jobs:
  pr_review_labels:
    permissions:
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: JoshuaKGoldberg/pr-review-labels-action@fc1cc3089bf2c523bd2b04f0955016c9e5c5e3b7

name: PR Review Labels

on:
  pull_request_target:
    types:
      - review_requested
  workflow_run:
    types:
      - completed
    workflows:
      - PR Review Submitted
