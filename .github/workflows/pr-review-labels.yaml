jobs:
  pr_review_labels:
    permissions:
      actions: read
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: JoshuaKGoldberg/pr-review-labels-action@4ef8743729b77c6eff5dc920857fc102e4036aa3

name: PR Review Labels

on:
  pull_request_target:
    types:
      - review_requested
  workflow_run:
    types:
      - completed
    workflows:
      - PR Review Submitted
