jobs:
  pr_review_submitted:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: echo "{\"pullRequest\":$PR_NUMBER,\"review\":$REVIEW_ID}" > pr-review-labels-record.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          path: pr-review-labels-record.json

name: PR Review Submitted

on:
  pull_request_review:
    types:
      - submitted
